      // 数据预处理：清洗数据 + 标记晶系分类

        const cleanItem = {
          t: item.t?.trim() || "无标题",
          s: item.s?.trim() || "",
          u: item.u?.trim() || "",
          l: item.l?.trim() || "",
        };

        // 标记分类（方便筛选）
        if (cleanItem.s.includes("等轴晶系")) cleanItem.category = "等轴晶系";
        else if (cleanItem.s.includes("三方晶系"))
          cleanItem.category = "三方晶系";

        else if (cleanItem.s.includes("斜方晶系"))
          cleanItem.category = "斜方晶系";
        else if (cleanItem.t === "测试晶体") cleanItem.category = "测试/互动类";
        else cleanItem.category = "特殊面";

      // 渲染网格 - 完善版
      function renderGridCards(dataToRender) {
        const gridContainer = document.getElementById("grid");
        const loadingTip = document.getElementById("loadingTip");

        // 隐藏加载提示
        if (loadingTip) loadingTip.style.display = "none";

        if (!gridContainer) {
          console.warn("[晶体展示] 网格容器不存在，无法渲染卡片");
          return;
        }

        // 清空容器，避免重复渲染
        gridContainer.innerHTML = "";
        const fragment = document.createDocumentFragment();

        // 无数据提示
        if (dataToRender.length === 0) {
          const emptyTip = document.createElement("div");
          emptyTip.style.gridColumn = "1/-1";
          emptyTip.style.padding = "40px 0";
          emptyTip.style.textAlign = "center";
          emptyTip.style.color = "#999";
          emptyTip.textContent = "暂无匹配的晶体数据";
          gridContainer.appendChild(emptyTip);
          return;
        }

        dataToRender.forEach((item) => {
          if (!item) return;

          // 核心校验：无图片+无链接 → 跳过
          const hasImage = !!item.u;
          const hasLink = !!item.l;
          if (!hasImage && !hasLink) return;

          // 创建卡片容器
          const card = document.createElement("div");
          card.className = "card";
          // 无障碍属性
          card.setAttribute("role", "article");
          card.setAttribute(
            "aria-label",
            `${item.t} - ${item.s || "无晶系信息"}`,
          );

          // 构建图片容器
          const imgContainer = document.createElement("div");
          imgContainer.className = "img-container";

          // 构建图片
          const img = document.createElement("img");
          img.loading = "lazy";
          img.alt = item.t;
          // 图片路径处理
          img.src = hasImage ? item.u : "";

          // 图片加载失败兜底
          img.onerror = function () {
            this.classList.add("error");
            this.alt = `${item.t} - 图片加载失败`;
          };

          // 构建链接（整个卡片可点击，而非仅图片）
          if (hasLink) {
            const link = document.createElement("a");
            link.href = item.l;
            link.target = "_blank";
            // 链接合法性校验
            link.onclick = function (e) {
              if (
                !this.href ||
                this.href.includes("!/") ||
                this.href === window.location.href
              ) {
                e.preventDefault();
                alert(`暂无法访问：${item.t}（链接无效）`);
              }
            };
            // 链接包裹图片容器（整个卡片可点击）
            link.appendChild(imgContainer);
            imgContainer.appendChild(img);
            card.appendChild(link);
          } else {
            imgContainer.appendChild(img);
            card.appendChild(imgContainer);
          }

          // 构建文本层
          const hasTitle = !!item.t;
          const hasS = !!item.s;
          if (hasTitle || hasS) {
            const caption = document.createElement("div");
            caption.className = "caption";

            if (hasTitle) {
              const title = document.createElement("h3");
              title.textContent = item.t;
              caption.appendChild(title);
            }

            if (hasS) {
              const subText = document.createElement("span");
              subText.textContent = item.s;
              caption.appendChild(subText);
            }

            card.appendChild(caption);
          }

          fragment.appendChild(card);
        });

        gridContainer.appendChild(fragment);
      }

      // 筛选功能实现
      function initFilter() {
        const filterBtns = document.querySelectorAll(".filter-btn");
        filterBtns.forEach((btn) => {
          btn.addEventListener("click", function () {
            // 切换激活状态
            filterBtns.forEach((b) => b.classList.remove("active"));
            this.classList.add("active");

            // 获取筛选条件
            const filter = this.dataset.filter;
            let filteredData = processedData;

            // 筛选数据
            if (filter !== "all") {
              filteredData = processedData.filter(
                (item) => item.category === filter,
              );
            }

            // 重新渲染
            renderGridCards(filteredData);
          });
        });
      }

      // 初始化
      window.addEventListener("DOMContentLoaded", function () {
        initFilter(); // 初始化筛选
        renderGridCards(processedData); // 初始渲染全部数据
      });
    </script>
  </body>
</html>
