      /* 全局样式重置 */
      * {
        margin: 0;

        box-sizing: border-box;
      }

      body {
        background-color: #f8f9fa;
        font-family: "Microsoft Yahei", sans-serif;
      }

      /* 网格布局 */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }

      /* 卡片核心样式 */
      .card {
        position: relative;
        width: 100%;
        aspect-ratio: 1/1; /* 固定正方形 */
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        background-color: #fff;
      }

      /* 图片容器 - 保证正方形且图片自适应 */
      .card .img-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f5f5f5;
      }

      .card img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* 保持长宽比，完整显示图片 */
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        opacity: 0.9;
      }

      /* 悬浮文本层 - 增强文字醒目度 */
      .card .caption {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 16px 20px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
        color: #fff;
        transition: all 0.3s ease;
        transform: translateY(10%);
        opacity: 0.8;
      }

      /* 标题样式 - 增强醒目度 */
      .card .caption h3 {
        font-size: 16px;
        margin: 0 0 6px 0;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 晶系信息样式 - 增强醒目度 */
      .card .caption span {
        font-size: 14px;
        opacity: 1;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
      }

      /* 鼠标hover效果 */
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      .card:hover img {
        opacity: 1;
        transform: scale(1.02);
      }

      .card:hover .caption {
        transform: translateY(0);
        opacity: 1;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
      }

      /* 响应式适配 */
      @media (max-width: 768px) {
        .grid {
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
          gap: 16px;
          padding: 16px;
        }

        .card .caption {
          padding: 12px 16px;
        }

        .card .caption h3 {
          font-size: 15px;
        }

        .card .caption span {
          font-size: 13px;
        }
      }
